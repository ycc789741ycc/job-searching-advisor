# The application, as it ships. `make start-app` (MODE=prod, the default) runs
# this file alone, with nothing mounted. `make start-app MODE=dev` layers
# compose.dev.yaml on top.
#
# `api`, `worker` and `crawler` are one image with three commands — that is
# what "one artifact promoted unchanged" means here.
#
# Each service is given only the configuration it needs. `env_file` is
# deliberately NOT on a shared anchor: handing every container the whole .env
# would put the master encryption key and the connector secrets inside the
# crawler and the SPA, which technical_boundaries section 4 forbids.
#
# The network is created by `start-infra`, which is why `start-app` needs infra
# to be up and cannot bring it up itself.

# Its own compose project, separate from infra's, so --remove-orphans here can
# only ever affect application containers.
name: jsa-app

networks:
  default:
    name: jsa_net
    external: true

# Docker's default json-file driver keeps every line a container writes,
# forever, which is how a quiet host eventually runs out of disk. Rotate it.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
      max-file: "${DOCKER_LOG_MAX_FILE:-3}"

x-hardened: &hardened
  <<: *logging
  security_opt:
    - no-new-privileges:true
  # These images are built locally by `make build-app`, never pulled. Without
  # this, a missing tag sends compose to Docker Hub — at best a confusing error,
  # at worst a stranger's public image that happens to share the name.
  pull_policy: never

x-backend: &backend
  <<: *hardened
  build:
    context: ./backend
    target: prod
  image: jsa-backend:prod
  # These processes only ever write to the caches declared below.
  read_only: true
  tmpfs:
    # Nothing here writes to /tmp itself; the cap is for libraries that do.
    - /tmp:size=128m

x-long-running: &long-running
  restart: unless-stopped

# Resource limits. Each service gets a memory ceiling, a CPU share and a
# process cap, so one runaway — a crawl that parses something huge, a PDF
# render that balloons — is OOM-killed and restarted on its own instead of
# starving Postgres and everything else on the host. memswap_limit equals
# mem_limit so an overrun is killed promptly and visibly, rather than swapping
# the host to a crawl. `make stats` shows usage against these ceilings, and any
# restarts or OOM kills.
#
# The defaults are about twice what each service was measured using, so they
# are optional settings: override them per environment in .env, never here.

services:
  # Verifies tokens, serves HTTP, starts connector OAuth. Holds the master key.
  api:
    <<: [*backend, *long-running]
    mem_limit: ${API_MEM_LIMIT:-768m}
    memswap_limit: ${API_MEM_LIMIT:-768m}
    cpus: ${API_CPUS:-1.0}
    pids_limit: 256
    env_file: .env
    command:
      - uvicorn
      - app.api_main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    ports:
      - "${API_PUBLISHED_PORT:-21470}:8000"

  # Runs AI jobs and connector syncs. Holds the master key and connector tokens.
  worker:
    <<: [*backend, *long-running]
    mem_limit: ${WORKER_MEM_LIMIT:-2g}
    memswap_limit: ${WORKER_MEM_LIMIT:-2g}
    cpus: ${WORKER_CPUS:-2.0}
    pids_limit: 512
    env_file: .env
    command: ["python", "-m", "app.worker_main"]
    volumes:
      # The local embedding model is downloaded once and reused.
      - modelcache:/home/app/.cache/huggingface

  # Parses hostile HTML from the internet, so it holds no secrets at all — not
  # the master encryption key, not a connector token, not even app_rw's
  # connection string. Its environment is listed explicitly rather than taken
  # from .env, and require_for(Unit.CRAWLER) asserts at startup that this is
  # genuinely all it needs.
  crawler:
    <<: [*backend, *long-running]
    mem_limit: ${CRAWLER_MEM_LIMIT:-2g}
    memswap_limit: ${CRAWLER_MEM_LIMIT:-2g}
    cpus: ${CRAWLER_CPUS:-1.0}
    pids_limit: 256
    command: ["python", "-m", "app.crawler_main"]
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      SERVICE_NAME: ${SERVICE_NAME:-job-searching-advisor}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CRAWLER_DATABASE_URL: ${CRAWLER_DATABASE_URL:?CRAWLER_DATABASE_URL is required}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      CRAWL_USER_AGENT: ${CRAWL_USER_AGENT:-JobSearchingAdvisorBot/1.0}
      CRAWL_HTTP_TIMEOUT_SECONDS: ${CRAWL_HTTP_TIMEOUT_SECONDS:-30}
      CRAWL_RATE_LIMIT_PER_HOST_PER_SECOND: ${CRAWL_RATE_LIMIT_PER_HOST_PER_SECOND:-1}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
    volumes:
      - modelcache:/home/app/.cache/huggingface

  # A one-off: every pending migration to completion, then exit. `make migrate`
  # runs it — as start-app's first step, in either mode — so the app never
  # serves on a half-migrated database. Not long-running, and behind a profile
  # so `up` never starts it.
  migrate:
    <<: *backend
    mem_limit: ${MIGRATE_MEM_LIMIT:-768m}
    memswap_limit: ${MIGRATE_MEM_LIMIT:-768m}
    cpus: ${MIGRATE_CPUS:-1.0}
    pids_limit: 256
    profiles: ["migrate"]
    env_file: .env
    command: ["python", "-m", "app.migrate_main"]

  # Static bundle plus a config.js written at start. Everything it receives
  # reaches the browser, so it receives nothing else.
  web:
    <<: [*hardened, *long-running]
    mem_limit: ${WEB_MEM_LIMIT:-512m}
    memswap_limit: ${WEB_MEM_LIMIT:-512m}
    cpus: ${WEB_CPUS:-0.5}
    pids_limit: 256
    build:
      context: ./web
      target: prod
    image: jsa-web:prod
    environment:
      WEB_API_BASE_URL: ${WEB_API_BASE_URL:?WEB_API_BASE_URL is required}
    ports:
      - "${WEB_PUBLISHED_PORT:-21471}:8080"

volumes:
  modelcache:
