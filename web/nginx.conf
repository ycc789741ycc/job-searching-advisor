server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Generated at container start from the environment; never cached, so a
    # redeploy with different configuration takes effect immediately.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files /config.js =404;
    }

    # The bundle is content-hashed, so it can be cached hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # A single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
